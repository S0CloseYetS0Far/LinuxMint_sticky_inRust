name: Sign-off

# Every commit in a pull request must carry a "Signed-off-by:" line with the
# commit author's email (git commit -s). See "Contributing" in README.md.

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/check-signoff.sh "$BASE" "$HEAD"
