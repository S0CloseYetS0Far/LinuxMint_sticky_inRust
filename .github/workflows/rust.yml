name: Rust

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgspell-1-dev libxapp-dev xvfb
      - name: Build
        run: cargo build --locked
      - name: Test
        run: xvfb-run -a cargo test --locked -- --test-threads=1
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
