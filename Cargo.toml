[package]
name = "sticky"
version = "1.33.0"
edition = "2021"
description = "Sticky notes for the Linux desktop"
license = "GPL-2.0-or-later"
repository = "https://github.com/S0CloseYetS0Far/LinuxMint_sticky_inRust"
rust-version = "1.75"
build = "build.rs"

[[bin]]
name = "sticky"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
gdk = { version = "0.18", features = ["v3_24"] }
glib = "0.18"
gio = "0.18"
pango = "0.18"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
roxmltree = "0.20"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
